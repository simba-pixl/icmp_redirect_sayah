---
- name: Adding aliases
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Enable IPv4 forwarding between attacker-switch and target-switch, persistent
  copy:
    dest: /etc/sysctl.d/99-icmp-redirect-lab.conf
    content: |
      net.ipv4.ip_forward = 1
    owner: root
    mode: '0644'

- name: Apply sysctl settings now
  command: sysctl --system
  changed_when: false

- name: Install router orientation README
  copy:
    src: README-router.txt
    dest: /home/ubuntu/README.txt
    mode: '0644'
