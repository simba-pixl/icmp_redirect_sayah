---
# Basic configuration of all host devices

- name: Install net-tools
  apt:
    name: net-tools
    update_cache: yes

- name: Install common diagnostic/attack tooling
  apt:
    name:
      - unzip
      - iproute2
      - iputils-ping
      - tcpdump
      - mtr-tiny
      - python3
      - python3-pip
    state: present
