---
- name: Adding aliases
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Ensure python3-pip and python3-scapy are present
  apt:
    name:
      - python3-pip
      - python3-scapy
    state: present
    update_cache: yes

- name: Make sure scapy is importable even if the package above is unavailable
  pip:
    name: scapy
    state: present
    executable: pip3
  ignore_errors: true

- name: Create a working directory for the student
  file:
    path: /home/seed/icmp-redirect-lab
    state: directory
    owner: seed
    group: seed
    mode: '0755'

- name: Install the Task 1 ICMP-redirect code skeleton (student fills in the @@@@)
  copy:
    src: icmp-redirect-skeleton.py
    dest: /home/seed/icmp-redirect-lab/icmp-redirect-skeleton.py
    owner: seed
    group: seed
    mode: '0644'

- name: Install a short orientation README
  copy:
    src: README-attacker.txt
    dest: /home/seed/icmp-redirect-lab/README.txt
    owner: seed
    group: seed
    mode: '0644'
