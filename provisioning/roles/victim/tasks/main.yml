---
- name: Adding aliases
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Install netcat client (used in Task 2)
  apt:
    name: netcat-openbsd
    state: present
    update_cache: yes

# Deliberately DISABLE the Ubuntu countermeasure against ICMP redirects, as
# instructed in the lab (net.ipv4.conf.all.accept_redirects=1), persistently.
- name: Disable the ICMP-redirect countermeasure (accept_redirects=1), persistent
  copy:
    dest: /etc/sysctl.d/99-icmp-redirect-lab.conf
    content: |
      net.ipv4.conf.all.accept_redirects = 1
      net.ipv4.conf.default.accept_redirects = 1
      net.ipv4.conf.eth0.accept_redirects = 1
      net.ipv4.route.flush = 1
    owner: root
    mode: '0644'

- name: Apply sysctl settings now
  command: sysctl --system
  changed_when: false

- name: Create a working directory for the student
  file:
    path: /home/seed/icmp-redirect-lab
    state: directory
    owner: seed
    group: seed
    mode: '0755'

# Per-sandbox secret word the student must relay into a netcat session in
# Task 2 (see provisioning/roles/malicious_router and provisioning/roles/target).
- name: Deliver the per-sandbox secret word (Task 2 input)
  template:
    src: secret_word.txt.j2
    dest: /home/seed/icmp-redirect-lab/secret_word.txt
    owner: seed
    group: seed
    mode: '0640'

# Awards flag_task1 only when the victim's route cache really shows the
# malicious router as the gateway for 192.168.60.5.
- name: Install the Task 1 flag checker outside the student home
  template:
    src: check-flag1.sh.j2
    dest: /usr/local/sbin/check-flag1
    owner: root
    group: root
    mode: '0700'

- name: Allow the student to execute only the Task 1 checker as root
  copy:
    dest: /etc/sudoers.d/icmp-redirect-check-flag1
    content: "seed ALL=(root) NOPASSWD: /usr/local/sbin/check-flag1\n"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Install victim orientation README
  copy:
    src: README-victim.txt
    dest: /home/seed/icmp-redirect-lab/README.txt
    owner: seed
    group: seed
    mode: '0644'
