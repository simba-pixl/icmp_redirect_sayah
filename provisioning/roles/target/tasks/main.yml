---
- name: Adding aliases
  loop: "{{ aliases | dict2items }}"
  lineinfile:
    path: /etc/hosts
    line: "{{ item.value }} {{ item.key }}"

- name: Create a working directory for the student
  file:
    path: /home/seed/icmp-redirect-lab
    state: directory
    owner: seed
    group: seed
    mode: '0755'

- name: Install the netcat-like logging listener
  copy:
    src: nc_logger.py
    dest: /usr/local/sbin/nc_logger.py
    owner: root
    mode: '0755'

- name: Create a private directory for the received-traffic log
  file:
    path: /var/log/icmp-redirect-lab
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create the root-owned received-traffic log
  file:
    path: /var/log/icmp-redirect-lab/received.log
    state: touch
    owner: root
    group: root
    mode: '0600'

- name: Install and start the Task 2 listener service (per-sandbox random port)
  template:
    src: icmp-lab-netcat.service.j2
    dest: /etc/systemd/system/icmp-lab-netcat.service
    mode: '0644'
  notify: Restart icmp-lab-netcat service

- name: Enable and start the Task 2 listener service
  systemd:
    name: icmp-lab-netcat
    enabled: true
    state: started
    daemon_reload: true

- name: Deliver the per-sandbox service port (Task 2 input)
  template:
    src: service_port.txt.j2
    dest: /home/seed/icmp-redirect-lab/service_port.txt
    owner: seed
    group: seed
    mode: '0640'

- name: Install the Task 2 flag checker outside the student home
  template:
    src: check-flag2.sh.j2
    dest: /usr/local/sbin/check-flag2
    owner: root
    group: root
    mode: '0700'

- name: Allow the student to execute only the Task 2 checker as root
  copy:
    dest: /etc/sudoers.d/icmp-redirect-check-flag2
    content: "seed ALL=(root) NOPASSWD: /usr/local/sbin/check-flag2\n"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Install target orientation README
  copy:
    src: README-target.txt
    dest: /home/seed/icmp-redirect-lab/README.txt
    owner: seed
    group: seed
    mode: '0644'
